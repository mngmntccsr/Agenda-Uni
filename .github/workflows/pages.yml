name: Deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # ogni 30 minuti, dalle 06:07 alle 22:37 ora italiana (cron e' in UTC; fino al 15/12 l'Italia e' a UTC+1).
    # Minuti 7 e 37 (non 0 e 30) perche' GitHub ritarda le esecuzioni all'inizio dell'ora.
    - cron: '7,37 5-21 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
    steps:
      - id: d
        # Gli aggiornamenti automatici (schedule) si fermano dal 15/12/2026 (ora italiana).
        # Push e avvio manuale restano sempre possibili.
        run: |
          STOP=2026-12-15
          TODAY=$(TZ=Europe/Rome date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ ! "$TODAY" < "$STOP" ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Oltre il $STOP: nessun aggiornamento automatico."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uni → Treno</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#166534}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{max-width:1100px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-weight:800;font-size:20px}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;white-space:nowrap}.pill.active{background:var(--accent);color:#fff}.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}.day{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:420px;padding:12px}.dayhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}.dow{font-weight:800}.date{font-size:12px;color:var(--muted)}.lesson{padding:11px 10px;border-radius:12px;background:#f1f5f9;margin-bottom:8px}.lesson b{display:block;font-size:14px;line-height:1.25}.time{font-weight:800;margin-bottom:4px}.room{font-size:12px;color:var(--muted);margin-top:5px}.travel{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.travel h4{font-size:12px;margin:0 0 7px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.train{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.train:last-child{border-bottom:0}.train strong{font-size:15px}.note{margin-top:16px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.45}.error{padding:18px;background:#fff;border:1px solid #fecaca;border-radius:14px;color:#991b1b}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:700px){.shell{padding:12px}.top{align-items:flex-start}.week{grid-template-columns:repeat(7,82vw);gap:9px}.day{min-height:65vh}.brand{font-size:18px}.toolbar{margin:0 -12px;padding-left:12px;padding-right:12px}.note{font-size:12px}}

.tt-wrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:44px repeat(7,minmax(104px,1fr));min-width:780px;font-size:12px}
.tt-head{padding:6px 4px;text-align:center;text-transform:capitalize;border-bottom:1px solid rgba(128,128,128,.4)}
.tt-col{position:relative;border-left:1px solid rgba(128,128,128,.25)}
.tt-hours{border-left:0}
.tt-hour{position:absolute;right:4px;transform:translateY(-50%);opacity:.6;font-size:10px}
.tt-line{position:absolute;left:0;right:0;border-top:1px solid rgba(128,128,128,.2)}
.tt-ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:2px 5px;overflow:hidden;line-height:1.25}
.tt-lesson{background:rgba(59,130,246,.85);color:#fff}
.tt-train{background:rgba(34,197,94,.85);color:#fff;white-space:nowrap}
a.pill{text-decoration:none;color:inherit;display:inline-block}a.pill.active{color:#fff}
.tt-src-B{background:rgba(139,92,246,.88)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
.tt-train-B{background:rgba(20,184,166,.88)}
.tt-head.today{background:rgba(239,68,68,.14);color:#b91c1c;font-weight:600;border-bottom:2px solid #ef4444}
.tt-col.today{background:rgba(239,68,68,.05)}
.tt-now{position:absolute;left:0;right:0;border-top:2px solid #ef4444;z-index:5;pointer-events:none}
.tt-now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:#ef4444}
.tt-now-lab{position:absolute;right:2px;transform:translateY(-50%);background:#ef4444;color:#fff;font-size:10px;padding:0 3px;border-radius:3px;z-index:5}
.tt-extra{background:#f59e0b;color:#111;border-style:dashed}

</style></head><body>
<main class="shell">
<header class="top"><div><div class="brand">Uni → Treno</div><div class="sub">Orari lezioni e treni · Lido di Lavinio ↔ Roma Termini</div></div><button class="pill" id="today">Oggi</button></header>
<div class="toolbar"><button class="pill" id="prev">← settimana</button><span class="pill active" id="range"></span><button class="pill" id="next">settimana →</button></div>
<div class="toolbar" id="tabs"></div>
<div id="out"><div class="loading">Aggiorno lezioni e collegamenti…</div></div>
<div class="note" id="note"></div>
</main>
<script>
const PX=0.9;
const $=id=>document.getElementById(id);
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const endOf=(a,b)=>mins(b)<mins(a)?1440:mins(b);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=(d,o)=>new Intl.DateTimeFormat('it-IT',o).format(d);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let week=monday(new Date()), data=null;
const cur=()=>{const h=decodeURIComponent(location.hash.slice(1)).toUpperCase();return data.timetables.some(t=>t.id===h)?h:data.timetables[0].id};

const lab=t=>{const tr=t.provider.startsWith('Trenitalia');return (tr?'🚆':'🚌')+' '+t.departure+'→'+t.arrival+(mins(t.arrival)<mins(t.departure)?'+1':'')+(tr?'':' '+esc(t.provider))};
const first=a=>{const s=new Set();return a.filter(x=>{const k=x.src||'';if(s.has(k))return false;s.add(k);return true})};
// affianca gli elementi che si sovrappongono nello stesso giorno (lezioni e mezzi; utile nel confronto C)
function lanes(items){const ends=[];const out=items.slice().sort((a,b)=>mins(a.s)-mins(b.s)).map(it=>{let k=ends.findIndex(e=>e<=mins(it.s));if(k<0)k=ends.length;ends[k]=endOf(it.s,it.e);return {it,k}});return {out,n:Math.max(ends.length,1)}}

function timetable(t,showSrc){
  const now=new Date(), today=iso(now), nowMin=now.getHours()*60+now.getMinutes();
  const days=Array.from({length:7},(_,i)=>{const d=iso(addDays(week,i));return t.days.find(x=>x.date===d)||{date:d,lessons:[],outbound:[],inbound:[]}});
  const all=[];
  days.forEach(d=>{d.lessons.forEach(l=>all.push(mins(l.start),mins(l.end)));first(d.outbound).forEach(o=>all.push(mins(o.departure)));first(d.inbound).forEach(i=>all.push(endOf(i.departure,i.arrival)))});
  const from=(all.length?Math.floor(Math.min(...all)/60):8)*60, to=(all.length?Math.ceil(Math.max(...all)/60):20)*60;
  const hours=Array.from({length:(to-from)/60+1},(_,i)=>from/60+i);
  const box=(a,b)=>`top:${(mins(a)-from)*PX}px;height:${Math.max((endOf(a,b)-mins(a))*PX,22)}px`;
  const H=(to-from)*PX, nowTop=(nowMin-from)*PX, showNow=nowMin>=from&&nowMin<=to, hasToday=days.some(d=>d.date===today);
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let h='<div class="tt-wrap"><div class="tt"><div class="tt-corner"></div>';
  days.forEach(d=>{const dt=new Date(d.date+'T12:00:00');h+=`<div class="tt-head${d.date===today?' today':''}"><b>${fmt(dt,{weekday:'short'})}</b> ${dt.getDate()}/${dt.getMonth()+1}</div>`});
  h+=`<div class="tt-col tt-hours" style="height:${H}px">`+hours.map(x=>`<div class="tt-hour" style="top:${(x*60-from)*PX}px">${String(x).padStart(2,'0')}:00</div>`).join('')+(hasToday&&showNow?`<div class="tt-now-lab" style="top:${nowTop}px">${hhmm}</div>`:'')+'</div>';
  days.forEach(d=>{
    const isT=d.date===today;
    h+=`<div class="tt-col${isT?' today':''}" style="height:${H}px">`+hours.map(x=>`<div class="tt-line" style="top:${(x*60-from)*PX}px"></div>`).join('');
    const items=[...d.lessons.map(l=>({type:'l',s:l.start,e:l.end,l})),...first(d.outbound).map(x=>({type:'t',s:x.departure,e:x.arrival,x})),...first(d.inbound).map(x=>({type:'t',s:x.departure,e:x.arrival,x}))];
    const {out,n}=lanes(items);
    out.forEach(({it,k})=>{
      const pos=`${box(it.s,it.e)};left:calc(${k}*100%/${n} + 2px);right:auto;width:calc(100%/${n} - 4px)`;
      if(it.type==='l'){const l=it.l;h+=`<div class="tt-ev tt-lesson${l.src==='B'?' tt-src-B':''}${l.extra?' tt-extra':''}" style="${pos}"><b>${l.start}–${l.end}</b> ${showSrc&&l.src?esc(l.src)+' · ':''}${esc(l.course)}${l.room?' · '+esc(l.room):''}</div>`}
      else{const x=it.x;h+=`<div class="tt-ev tt-train${x.src==='B'?' tt-train-B':''}" style="${pos}">${showSrc&&x.src?esc(x.src)+' · ':''}${lab(x)}</div>`}
    });
    if(isT&&showNow)h+=`<div class="tt-now" style="top:${nowTop}px"></div>`;
    h+='</div>';
  });
  return h+'</div></div>';
}
function render(keep){
  $('range').textContent=fmt(week,{day:'numeric',month:'short'})+' – '+fmt(addDays(week,6),{day:'numeric',month:'short'});
  if(!data)return;
  const id=cur(), t=data.timetables.find(x=>x.id===id);
  $('tabs').innerHTML=data.timetables.map(x=>`<a class="pill${x.id===id?' active':''}" href="#${esc(x.id)}">${esc(x.label)}</a>`).join('');
  let h='';
  if(t.error)h=`<div class="error">${esc(t.error)}</div>`;
  else{
    if(t.warning)h+=`<div class="note">${esc(t.warning)}</div>`;
    if(id==='C')h+='<div class="sub" style="margin:8px 0"><span class="lg" style="background:rgba(59,130,246,.85);margin-left:0"></span>A<span class="lg" style="background:rgba(139,92,246,.88)"></span>B<span class="lg" style="background:#f59e0b"></span>extra<span class="lg" style="background:rgba(34,197,94,.85)"></span>mezzi A<span class="lg" style="background:rgba(20,184,166,.88)"></span>mezzi B</div>';
    h+=timetable(t,id==='C');
  }
  const old=document.querySelector('.tt-wrap'),sl=keep&&old?old.scrollLeft:null;
  $('out').innerHTML=h;
  const w=document.querySelector('.tt-wrap');
  if(w){if(sl!==null)w.scrollLeft=sl;else{const th=w.querySelector('.tt-head.today');if(th)w.scrollLeft=Math.max(0,th.getBoundingClientRect().left-w.getBoundingClientRect().left+w.scrollLeft-48)}}
}
window.addEventListener('hashchange',()=>render());
setInterval(()=>render(true),60000);
$('today').onclick=()=>{week=monday(new Date());render()};
$('prev').onclick=()=>{week=addDays(week,-7);render()};
$('next').onclick=()=>{week=addDays(week,7);render()};
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Dati non ancora disponibili');return r.json()}).then(j=>{
  data=j;
  $('note').textContent='Aggiornato: '+new Date(j.generatedAt).toLocaleString('it-IT')+'. Il calcolo del viaggio considera 20 minuti tra università e stazione. I treni mostrati sono suggerimenti: controlla sempre eventuali modifiche, ritardi o cancellazioni prima di partire.';
  render();
}).catch(e=>{$('out').innerHTML='<div class="error">'+esc(e.message||'Errore')+'</div>'});
render();
</script></body></html>
